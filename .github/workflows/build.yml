# Builds the iPhone app, widgets, Apple Watch app and complication on a cloud Mac
# after every push. No Apple account or signing needed.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone and Apple Watch simulators
        run: |
          xcodebuild build \
            -project Lumina.xcodeproj \
            -scheme Lumina \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || {
              errors=$(grep -E "(error|fatal error):" build.log | sed "s#$PWD/##" | sort -u | head -40)
              [ -n "$errors" ] || errors=$(tail -25 build.log)
              echo "::error title=Build failed::$(printf '%s' "$errors" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
              exit 1
            }
          warnings=$(grep -E "warning:" build.log | sed "s#$PWD/##" | sort -u)
          echo "::notice title=Build succeeded::$(printf '%s' "$warnings" | grep -c . || true) unique warnings"
          if [ -n "$warnings" ]; then
            echo "::warning title=Compiler warnings::$(printf '%s' "$warnings" | head -30 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
