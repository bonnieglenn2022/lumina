# Builds the iPhone app, widgets, Apple Watch app and complication on a cloud Mac
# after every push. No Apple account or signing needed.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone and Apple Watch simulators
        run: |
          xcodebuild build \
            -project Lumina.xcodeproj \
            -scheme Lumina \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || { ci/annotate.sh error "Build failed" build.log; exit 1; }
          warnings=$(grep -E "warning:" build.log | sed "s#$PWD/##" | sort -u)
          files=$(grep -oE "(SwiftCompile|CompileSwift) [^ ]+ [^ ]+ [^ ]+\.swift" build.log | grep -oE "[A-Za-z]+\.swift" | sort -u | wc -l | tr -d ' ')
          products=$(grep -oE "[A-Za-z]+\.(app|appex)" build.log | sort -u | tr '\n' ' ')
          result=$(grep -oE "\*\* BUILD [A-Z]+ \*\*" build.log | tail -1)
          echo "::notice title=Build succeeded::$result | $files Swift files compiled | built: $products| $(printf '%s' "$warnings" | grep -c . || true) unique warnings"
          if [ -n "$warnings" ]; then
            grep -E "warning:" build.log > warnings.log
            ci/annotate.sh warning "Compiler warnings" warnings.log
          fi

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
